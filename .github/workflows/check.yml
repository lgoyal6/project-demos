name: Check public demo bundle
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python render.py
      - run: python check-site.py
      - run: node tests/workspaces.mjs
      - run: python check-source-boundary.py
